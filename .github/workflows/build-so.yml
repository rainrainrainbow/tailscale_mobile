name: Build libtailscale.so

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Build libtailscale.so for arm64-v8a
        working-directory: libtailscale
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: |
          go build -buildmode=c-shared -o libtailscale_arm64.so -tags android
          ls -lh libtailscale_arm64.so

      - name: Build libtailscale.so for armeabi-v7a
        working-directory: libtailscale
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: arm
          GOARM: 7
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
        run: |
          go build -buildmode=c-shared -o libtailscale_armv7a.so -tags android
          ls -lh libtailscale_armv7a.so

      - name: Build libtailscale.so for x86_64
        working-directory: libtailscale
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: amd64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
        run: |
          go build -buildmode=c-shared -o libtailscale_x86_64.so -tags android
          ls -lh libtailscale_x86_64.so

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libtailscale/libtailscale_arm64.so
            libtailscale/libtailscale_armv7a.so
            libtailscale/libtailscale_x86_64.so
          generate_release_notes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtailscale-so
          path: |
            libtailscale/libtailscale_arm64.so
            libtailscale/libtailscale_armv7a.so
            libtailscale/libtailscale_x86_64.so
